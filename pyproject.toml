[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mp-gastos"
version = "0.1.0"
description = "A local Mercado Pago expense ledger for Argentina"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "mp-gastos contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business :: Financial :: Accounting"]

[project.urls]
Repository = "https://github.com/nachthelad/mp-gastos"

[project.scripts]
mp-gastos = "mp_gastos.cli:main"

[tool.setuptools.package-data]
mp_gastos = ["rules.toml"]
