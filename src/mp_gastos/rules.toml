[issuers]
# 71 = "Banco de ejemplo"

# Créditos SETTLEMENT sin descripción, contraparte ni referencia.
[yield_heuristic]
enabled = true
start = "00:00"
end = "02:59"
max_amount = "1000.00"
category = "Rendimientos"

# Se aplica al final, después del rendimiento y de las reglas.
[credit_fallback]
enabled = true
category = "Transferencias recibidas"

# Rules are evaluated in order. Categories can be freely renamed.
[[rule]]
field = "external_reference"
prefix = "ccpaymentprod_"
kind = "card_payment"
category = "Tarjeta"
direction = "debit"

[[rule]]
field = "external_reference"
prefix = "cctiprod-"
kind = "card_payment"
category = "Tarjeta"
direction = "debit"

[[rule]]
field = "transaction_type"
contains = "TRANSFER"
kind = "transfer"
category = "Transferencias"

[[rule]]
field = "transaction_type"
contains = "YIELD"
kind = "yield"
category = "Rendimientos"
direction = "credit"

[[rule]]
field = "transaction_type"
contains = "REFUND"
kind = "refund"
category = "Devoluciones"
direction = "credit"

[[rule]]
field = "transaction_type"
contains = "FEE"
kind = "fee"
category = "Comisiones"
direction = "debit"

[[rule]]
field = "description"
contains = "librería"
kind = "purchase"
category = "Libros"
direction = "debit"

